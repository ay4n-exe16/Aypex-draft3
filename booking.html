<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Booking System — AYPEX.Co</title>

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      color: #f4f8ff;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(54, 215, 255, 0.12),
          transparent 32%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(91, 76, 255, 0.14),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #050d18,
          #081421 55%,
          #070c18
        );

      overflow-x: hidden;
    }


    /* =========================================
       AMBIENT BACKGROUND
    ========================================= */

    .ambient {
      position: fixed;
      inset: 0;

      pointer-events: none;

      overflow: hidden;

      z-index: 0;
    }


    .orb {
      position: absolute;

      border-radius: 50%;

      filter: blur(90px);

      opacity: 0.18;
    }


    .orb-one {
      width: 420px;
      height: 420px;

      background: #32d9ff;

      top: -170px;
      left: -120px;

      animation:
        orbOne 10s ease-in-out infinite alternate;
    }


    .orb-two {
      width: 500px;
      height: 500px;

      background: #625cff;

      right: -220px;
      bottom: -230px;

      animation:
        orbTwo 12s ease-in-out infinite alternate;
    }


    @keyframes orbOne {

      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(100px, 80px);
      }

    }


    @keyframes orbTwo {

      from {
        transform: translate(0, 0);
      }

      to {
        transform: translate(-80px, -70px);
      }

    }


    /* =========================================
       FLOATING PARTICLES
    ========================================= */

    .particle {
      position: absolute;

      width: 3px;
      height: 3px;

      border-radius: 50%;

      background: #54ddff;

      opacity: 0;

      animation:
        particleMove 8s linear infinite;
    }


    .particle:nth-child(3) {
      left: 12%;
      top: 65%;
      animation-delay: 1s;
    }


    .particle:nth-child(4) {
      left: 30%;
      top: 30%;
      animation-delay: 3s;
    }


    .particle:nth-child(5) {
      left: 73%;
      top: 22%;
      animation-delay: 2s;
    }


    .particle:nth-child(6) {
      left: 86%;
      top: 65%;
      animation-delay: 5s;
    }


    @keyframes particleMove {

      0% {
        opacity: 0;
        transform: translateY(35px);
      }

      30% {
        opacity: 0.5;
      }

      70% {
        opacity: 0.5;
      }

      100% {
        opacity: 0;
        transform: translateY(-100px);
      }

    }


    /* =========================================
       NAVBAR
    ========================================= */

    header {

      position: relative;

      z-index: 20;

      width: calc(100% - 66px);

      max-width: 1250px;

      height: 76px;

      margin: 28px auto 0;

      padding: 0 23px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border: 1px solid rgba(92, 215, 255, 0.24);

      border-radius: 45px;

      background:
        rgba(7, 18, 31, 0.58);

      backdrop-filter: blur(20px);

      -webkit-backdrop-filter: blur(20px);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.06),
        0 18px 50px rgba(0,0,0,0.25);

    }


    /* =========================================
       AYPEX LOGO
    ========================================= */

    .brand {

      display: flex;

      align-items: center;

      gap: 15px;

      text-decoration: none;

      color: #f5f9ff;

    }


    .logo {

      width: 43px;
      height: 43px;

      border: 1.5px solid #52ddff;

      border-radius: 50%;

      position: relative;

      display: flex;

      justify-content: center;

      align-items: center;

      box-shadow:
        0 0 18px rgba(73, 219, 255, 0.16),
        inset 0 0 15px rgba(73, 219, 255, 0.07);

    }


    /*
      Stylized AYPEX A symbol
    */

    .logo-a {

      width: 18px;
      height: 24px;

      position: relative;

      transform: skew(-13deg);

    }


    .logo-a::before,
    .logo-a::after {

      content: "";

      position: absolute;

      top: 0;

      width: 3px;

      height: 25px;

      background: #55ddff;

      border-radius: 3px;

    }


    .logo-a::before {

      left: 3px;

      transform: rotate(23deg);

    }


    .logo-a::after {

      right: 3px;

      transform: rotate(-23deg);

    }


    .logo-a span {

      position: absolute;

      width: 11px;
      height: 3px;

      background: #55ddff;

      left: 3px;
      top: 14px;

      transform: rotate(-13deg);

      box-shadow:
        0 0 8px rgba(85, 221, 255, 0.7);

    }


    .brand-name {

      font-size: 19px;

      font-weight: 700;

      letter-spacing: 5px;

    }


    .brand-name span {

      color: #50dcff;

    }


    .menu {

      width: 34px;

      height: 28px;

      display: flex;

      flex-direction: column;

      justify-content: center;

      gap: 7px;

      cursor: pointer;

    }


    .menu span {

      display: block;

      width: 28px;

      height: 2px;

      background: #d9eaff;

      border-radius: 3px;

    }


    /* =========================================
       MAIN
    ========================================= */

    main {

      position: relative;

      z-index: 5;

      min-height:
        calc(100vh - 104px);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 45px 25px 70px;

    }


    /* =========================================
       GLASS CARD
    ========================================= */

    .booking-card {

      position: relative;

      width: min(720px, 100%);

      padding:
        70px
        55px
        60px;

      text-align: center;

      overflow: hidden;

      border-radius: 32px;

      border: 1px solid rgba(74, 215, 255, 0.30);

      background:
        linear-gradient(
          145deg,
          rgba(35, 91, 116, 0.20),
          rgba(7, 18, 31, 0.70)
        );

      backdrop-filter: blur(26px);

      -webkit-backdrop-filter: blur(26px);

      box-shadow:

        0 40px 100px
        rgba(0,0,0,0.42),

        inset 0 1px 0
        rgba(255,255,255,0.08);

      animation:
        cardAppear 1s
        cubic-bezier(.2,.8,.2,1)
        forwards;

    }


    @keyframes cardAppear {

      from {

        opacity: 0;

        transform:
          translateY(45px)
          scale(0.94);

        filter: blur(8px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);

        filter: blur(0);

      }

    }


    /* =========================================
       DIAGONAL GLASS LINE
    ========================================= */

    .diagonal {

      position: absolute;

      width: 850px;

      height: 1px;

      top: 48%;
      left: -80px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(88, 218, 255, 0.20),
          rgba(117, 102, 255, 0.25),
          transparent
        );

      transform: rotate(-57deg);

      pointer-events: none;

    }


    /* =========================================
       CORNER DETAILS
    ========================================= */

    .corner {

      position: absolute;

      width: 25px;
      height: 25px;

      border-color:
        rgba(79, 218, 255, 0.45);

      border-style: solid;

    }


    .corner.tl {

      top: 21px;
      left: 21px;

      border-width:
        1px
        0
        0
        1px;

    }


    .corner.tr {

      top: 21px;
      right: 21px;

      border-width:
        1px
        1px
        0
        0;

    }


    .corner.bl {

      bottom: 21px;
      left: 21px;

      border-width:
        0
        0
        1px
        1px;

    }


    .corner.br {

      bottom: 21px;
      right: 21px;

      border-width:
        0
        1px
        1px
        0;

    }


    /* =========================================
       CENTER AYPEX SYMBOL
    ========================================= */

    .symbol-wrap {

      position: relative;

      width: 110px;
      height: 110px;

      margin:
        0 auto
        35px;

      display: flex;

      align-items: center;

      justify-content: center;

      border-radius: 50%;

      border:
        1px solid
        rgba(82, 219, 255, 0.40);

      box-shadow:
        0 0 30px
        rgba(60, 215, 255, 0.12),

        inset 0 0 30px
        rgba(60, 215, 255, 0.07);

      animation:
        symbolPulse 3s
        ease-in-out
        infinite;

    }


    /*
      Orbit ring
    */

    .symbol-wrap::before {

      content: "";

      position: absolute;

      inset: -10px;

      border-radius: 50%;

      border:
        1px solid
        rgba(76, 215, 255, 0.10);

      border-top-color:
        rgba(76, 215, 255, 0.70);

      animation:
        orbit 5s
        linear
        infinite;

    }


    /*
      Orbit dot
    */

    .symbol-wrap::after {

      content: "";

      position: absolute;

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #55ddff;

      top: 4px;

      left: 50%;

      transform: translateX(-50%);

      box-shadow:
        0 0 12px #55ddff;

      animation:
        orbit 5s
        linear
        infinite;

    }


    @keyframes orbit {

      to {
        transform:
          rotate(360deg);
      }

    }


    @keyframes symbolPulse {

      0%,
      100% {

        transform: scale(1);

        box-shadow:
          0 0 30px
          rgba(60,215,255,0.12),

          inset 0 0 30px
          rgba(60,215,255,0.07);

      }

      50% {

        transform: scale(1.05);

        box-shadow:
          0 0 45px
          rgba(60,215,255,0.22),

          inset 0 0 35px
          rgba(60,215,255,0.12);

      }

    }


    /* =========================================
       SYMBOL
    ========================================= */

    .big-a {

      position: relative;

      width: 40px;
      height: 53px;

      transform: skew(-12deg);

    }


    .big-a::before,
    .big-a::after {

      content: "";

      position: absolute;

      top: 0;

      width: 6px;

      height: 53px;

      border-radius: 6px;

      background:
        linear-gradient(
          180deg,
          #7be8ff,
          #36c9f5
        );

      box-shadow:
        0 0 12px
        rgba(73,220,255,0.35);

    }


    .big-a::before {

      left: 5px;

      transform:
        rotate(24deg);

    }


    .big-a::after {

      right: 5px;

      transform:
        rotate(-24deg);

    }


    .big-a span {

      position: absolute;

      width: 26px;
      height: 6px;

      left: 7px;
      top: 31px;

      background: #55ddff;

      transform:
        rotate(-12deg);

      border-radius: 5px;

    }


    /* =========================================
       TEXT
    ========================================= */

    .eyebrow {

      position: relative;

      z-index: 2;

      color: #61ddff;

      font-family: monospace;

      font-size: 13px;

      letter-spacing: 5px;

      margin-bottom: 24px;

      text-transform: uppercase;

      animation:
        fadeUp 0.9s
        0.2s
        both;

    }


    h1 {

      position: relative;

      z-index: 2;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-weight: 400;

      font-size:
        clamp(48px, 8vw, 76px);

      line-height: 0.98;

      letter-spacing: -3px;

      margin-bottom: 30px;

      animation:
        fadeUp 0.9s
        0.35s
        both;

    }


    h1 span {

      color: #58dcff;

      font-style: italic;

    }


    .message {

      position: relative;

      z-index: 2;

      max-width: 570px;

      margin: auto;

      color: #aebed1;

      font-size: 18px;

      line-height: 1.75;

      animation:
        fadeUp 0.9s
        0.5s
        both;

    }


    @keyframes fadeUp {

      from {

        opacity: 0;

        transform:
          translateY(20px);

      }

      to {

        opacity: 1;

        transform:
          translateY(0);

      }

    }


    /* =========================================
       STATUS
    ========================================= */

    .status {

      position: relative;

      z-index: 2;

      display: inline-flex;

      align-items: center;

      gap: 11px;

      margin-top: 38px;

      padding:
        13px
        21px;

      border-radius: 30px;

      border:
        1px solid
        rgba(83, 219, 255, 0.23);

      background:
        rgba(54, 211, 255, 0.055);

      color: #c7edfa;

      font-family: monospace;

      font-size: 12px;

      letter-spacing: 2px;

      animation:
        fadeUp 0.9s
        0.65s
        both;

    }


    .status-dot {

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #51dcff;

      box-shadow:
        0 0 10px
        #51dcff;

      animation:
        statusPulse 1.5s
        ease-in-out
        infinite;

    }


    @keyframes statusPulse {

      0%,
      100% {

        opacity: 1;

        transform:
          scale(1);

      }

      50% {

        opacity: 0.35;

        transform:
          scale(0.7);

      }

    }


    /* =========================================
       NAVIGATION BUTTONS
    ========================================= */

    .navigation {

      position: relative;

      z-index: 2;

      margin-top: 45px;

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 14px;

      animation:
        fadeUp 0.9s
        0.8s
        both;

    }


    .nav-button {

      min-height: 58px;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 15px 20px;

      border-radius: 10px;

      border:
        1px solid
        rgba(105, 218, 255, 0.25);

      background:
        rgba(9, 23, 37, 0.38);

      color: #dcefff;

      text-decoration: none;

      font-family: monospace;

      font-size: 14px;

      letter-spacing: 1px;

      transition:
        0.25s ease;

      backdrop-filter:
        blur(10px);

    }


    .nav-button:hover {

      transform:
        translateY(-3px);

      border-color:
        rgba(84, 222, 255, 0.75);

      color: #59ddff;

      background:
        rgba(60, 210, 255, 0.07);

      box-shadow:
        0 10px 30px
        rgba(40, 205, 255, 0.10);

    }


    .nav-button.primary {

      background:
        linear-gradient(
          135deg,
          rgba(52, 207, 255, 0.13),
          rgba(94, 85, 255, 0.12)
        );

    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 700px) {

      header {

        width:
          calc(100% - 30px);

        height: 66px;

        margin-top: 15px;

        padding:
          0 17px;

      }


      .logo {

        width: 36px;
        height: 36px;

      }


      .brand-name {

        font-size: 16px;

        letter-spacing: 4px;

      }


      .menu {

        width: 30px;

      }


      .menu span {

        width: 25px;

      }


      main {

        min-height:
          calc(100vh - 81px);

        padding:
          20px 15px 35px;

      }


      .booking-card {

        padding:
          55px 23px 35px;

        border-radius: 27px;

      }


      .symbol-wrap {

        width: 88px;
        height: 88px;

        margin-bottom: 29px;

      }


      .big-a {

        transform:
          scale(0.78)
          skew(-12deg);

      }


      .eyebrow {

        font-size: 11px;

        letter-spacing: 4px;

      }


      h1 {

        font-size: 48px;

        letter-spacing: -2px;

      }


      .message {

        font-size: 16px;

        line-height: 1.65;

      }


      .status {

        font-size: 10px;

        letter-spacing: 1.4px;

        padding:
          11px 15px;

      }


      .navigation {

        grid-template-columns: 1fr;

        margin-top: 34px;

      }


      .nav-button {

        min-height: 55px;

      }


      .corner {

        width: 19px;
        height: 19px;

      }

    }

  </style>
</head>


<body>


  <!-- =====================================
       BACKGROUND
  ====================================== -->

  <div class="ambient">

    <div class="orb orb-one"></div>

    <div class="orb orb-two"></div>

    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>

  </div>



  <!-- =====================================
       HEADER
  ====================================== -->

  <header>

    <a
      href="index.html"
      class="brand"
    >

      <div class="logo">

        <div class="logo-a">
          <span></span>
        </div>

      </div>


      <div class="brand-name">

        AYPEX <span>.CO</span>

      </div>

    </a>


    <div class="menu">

      <span></span>
      <span></span>
      <span></span>

    </div>

  </header>



  <!-- =====================================
       MAIN
  ====================================== -->

  <main>


    <section class="booking-card">


      <!-- Corner accents -->

      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>


      <!-- Diagonal glass line -->

      <div class="diagonal"></div>



      <!-- =================================
           AYPEX SYMBOL
      ================================== -->

      <div class="symbol-wrap">

        <div class="big-a">

          <span></span>

        </div>

      </div>



      <!-- =================================
           CONTENT
      ================================== -->

      <div class="eyebrow">

        BOOKING SYSTEM

      </div>


      <h1>

        Coming <span>soon.</span>

      </h1>


      <p class="message">

        The booking system will be available soon.
        <br>

        Stay tuned for more updates.

      </p>



      <!-- =================================
           STATUS
      ================================== -->

      <div class="status">

        <span class="status-dot"></span>

        SYSTEM IN DEVELOPMENT

      </div>



      <!-- =================================
           NAVIGATION
      ================================== -->

      <div class="navigation">


        <a
          href="index.html"
          class="nav-button"
        >

          ← Back to AYPEX

        </a>


        <a
          href="founder.html"
          class="nav-button primary"
        >

          Founder’s Desk →

        </a>


      </div>


    </section>


  </main>



</body>
</html>
